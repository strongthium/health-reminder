# Builds, tests and releases health-reminder when the deploy branch is pushed to (a merge into deploy included).
# master holds the source and nothing is built from it. The version is the one in VERSION (build.ps1 -Bump changes
# it), and a version is released once: pushing to deploy without a new one fails. The organization allows only
# actions pinned to a full commit SHA: the tag each one is pinned at is beside it.
name: Build and release

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

  build:
    name: Build win-x64, needs-dotnet
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/HealthReminder -c Release -r win-x64 -o out/health-reminder
          cp README.md LICENSE out/health-reminder/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-reminder-win-x64-needs-dotnet
          path: out/health-reminder
          if-no-files-found: error

  release:
    name: Release
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d ' \r\n' < VERSION)
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$version is already released. Raise the version (build.ps1 -Bump patch) and push again."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Pack
        run: |
          mkdir dist
          cd artifacts
          for dir in health-reminder-*; do
            suffix=${dir#health-reminder-}
            name="health-reminder-$VERSION-$suffix"
            mv "$dir" "$name"
            zip -qr "../dist/$name.zip" "$name"
          done
          cd ../dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "health-reminder $VERSION" \
            --notes "Built from $GITHUB_SHA on the deploy branch. For Windows 10 and 11 on x64 PCs: unpack and run \`health-reminder.exe\` (about 3 MB). It runs on the .NET 10 Desktop Runtime installed on the PC (https://dotnet.microsoft.com/download/dotnet/10.0), which Microsoft Update keeps patched. The SHA-256 checksum is in SHA256SUMS."
